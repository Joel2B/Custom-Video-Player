<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>VOD</title>
    <%= htmlWebpackPlugin.tags.headTags %>
    <style lang="css">
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
      }

      #fluid-player-e2e-case {
        width: clamp(320px, 50vw, 960px);
        max-width: 90vw;
        margin: 0 auto;
        height: auto;
        aspect-ratio: 16 / 9;
      }
    </style>
  </head>
  <body>
    <video id="fluid-player-e2e-case">
      <source
        src="https://cdn.fluidplayer.com/videos/valerian-1080p.mkv"
        data-fluid-hd
        title="1080p"
        type="video/mp4"
      />
      <source src="https://cdn.fluidplayer.com/videos/valerian-720p.mkv" data-fluid-hd title="720p" type="video/mp4" />
      <source src="https://cdn.fluidplayer.com/videos/valerian-480p.mkv" title="480p" type="video/mp4" />
    </video>

    <%= htmlWebpackPlugin.tags.bodyTags %>

    <script>
      const instance = fluidPlayer('fluid-player-e2e-case');
    </script>
  </body>
</html>
