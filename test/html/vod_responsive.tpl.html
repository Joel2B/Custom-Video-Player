<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>VOD responsive</title>
    <%= htmlWebpackPlugin.tags.headTags %>
    <style lang="css">
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
      }

      #video-container {
        display: inline-block;
        width: clamp(320px, 50vw, 960px);
        position: relative;
        margin: 0 auto;
      }

      #video-container.resized {
        width: clamp(280px, 35vw, 720px);
      }

      #video-container #spacer {
        margin-top: 56.25%;
      }

      #video-container #video-wrapper {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background: red;
      }
    </style>
  </head>
  <body>
    <div>
      <p>
        <button id="toggle-size">Toggle size</button>
      </p>
    </div>
    <div id="video-container">
      <div id="spacer"></div>
      <div id="video-wrapper">
        <video id="fluid-player-e2e-case">
          <source
            src="https://cdn.fluidplayer.com/videos/valerian-1080p.mkv"
            data-fluid-hd
            title="1080p"
            type="video/x-matroska"
          />
          <source
            src="https://cdn.fluidplayer.com/videos/valerian-720p.mkv"
            data-fluid-hd
            title="720p"
            type="video/x-matroska"
          />
          <source src="https://cdn.fluidplayer.com/videos/valerian-480p.mkv" title="480p" type="video/x-matroska" />
        </video>
      </div>
    </div>

    <%= htmlWebpackPlugin.tags.bodyTags %>

    <script>
      const videoContainer = document.getElementById('video-container');

      document.getElementById('toggle-size').addEventListener('click', function () {
        videoContainer.classList.toggle('resized');
      });

      const instance = fluidPlayer('fluid-player-e2e-case', {
        layoutControls: {
          fillToContainer: true,
        },
      });
    </script>
  </body>
</html>
