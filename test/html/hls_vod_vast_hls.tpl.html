<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>HLS VOD with VAST HLS</title>
    <%= htmlWebpackPlugin.tags.headTags %>
    <style lang="css">
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
      }

      #fluid-player-e2e-case {
        width: clamp(320px, 50vw, 960px);
        max-width: 90vw;
        margin: 0 auto;
        height: auto;
        aspect-ratio: 16 / 9;
      }
    </style>
  </head>
  <body>
    <video id="fluid-player-e2e-case">
      <source src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" type="application/x-mpegURL" />
    </video>

    <%= htmlWebpackPlugin.tags.bodyTags %>

    <script>
      const instance = fluidPlayer('fluid-player-e2e-case', {
        vastOptions: {
          skipButtonCaption: 'Wait [seconds] please.',
          skipButtonClickCaption: 'Click to skip now',
          vastTimeout: 5000,
          showPlayButton: true,
          adList: [
            {
              roll: 'preRoll',
              vastTag: 'static/vast_hls.xml',
            },
            {
              roll: 'midRoll',
              vastTag: 'static/vast_hls.xml',
              timer: 15,
            },
          ],
        },
      });
    </script>
  </body>
</html>
